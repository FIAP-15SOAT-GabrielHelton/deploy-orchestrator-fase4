name: Deploy All (Fase 4 — k8s-infra-fase4 -> db-infra-fase4 -> os-service -> billing-service -> execution-service -> auth-serverless-fase4)

# Recebe as credenciais da sessão AWS Academy UMA ÚNICA VEZ e dispara/aguarda,
# em sequência, o workflow "CD Deploy" de cada um dos 6 repositórios do
# projeto. Interrompe a cadeia (falha rápido) se qualquer etapa não concluir
# com sucesso.
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

concurrency:
  group: oficina-mecanica-deploy-all
  cancel-in-progress: false

jobs:
  deploy:
    name: Orchestrate Deploy
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
      ORG: FIAP-15SOAT-GabrielHelton
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.ORCHESTRATOR_PAT }}"

      - name: Deploy k8s-infra-fase4
        run: |
          .github/scripts/run_and_wait.sh k8s-infra-fase4 cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"

      - name: Deploy db-infra-fase4
        run: |
          .github/scripts/run_and_wait.sh db-infra-fase4 cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"

      - name: Deploy os-service
        run: |
          .github/scripts/run_and_wait.sh os-service cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"

      - name: Deploy billing-service
        run: |
          .github/scripts/run_and_wait.sh billing-service cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"

      - name: Deploy execution-service
        run: |
          .github/scripts/run_and_wait.sh execution-service cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"

      - name: Deploy auth-serverless-fase4
        run: |
          .github/scripts/run_and_wait.sh auth-serverless-fase4 cd_deploy.yml \
            "${{ inputs.aws_access_key_id }}" "${{ inputs.aws_secret_access_key }}" "${{ inputs.aws_session_token }}"
